                      type: string
                      pattern: ^[a-z0-9]+$
                    verb:
                      type: string
                      enum:
                        - CreateProperty
                    Property:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Property name
                        country:
                          type: string
                          pattern: ^[A-Z]{2}$
                          description: |
                            2-letter ISO 3166-1 alpha-2 country code. This is the country the property is located in.
                        currency:
                          type: string
                          pattern: ^[A-Z]{3}$
