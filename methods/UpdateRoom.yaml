---
post:
  operationId: update_room
  description: >
    Create of update room after it has been changed on the Cloudbeds channel manager.
  requestBody:
    content:
      application/json:
        examples:
          $ref: ../examples/methods/UpdateRoom.yaml#/rq
        schema:
          allOf:
            - $ref: ../schemas.yaml#/auth
            - type: object
              properties:
                room:
                  type: object
                  properties:
                    mya_room_id:
                      type: integer
                      minimum: 1
                      description: Room ID on the Cloudbeds channel manager.
                    ota_room_id:
                      type: string
                      description: Room ID on the OTA.
                    units:
                      type: integer
                      minimum: 1
                      description: How many rooms of this type there are.
                    beds:
                      type: integer
                      minimum: 1
                      description: Number people that can stay in this room.
                    dormitory:
                      type: boolean
                      description: >
                        If `true` it's a dormitory (shared room), `false` for
                        private rooms.
                    gender:
                      type: string
                      description: Gender. Required for dormitory
                      enum:
                        - MALE
                        - FEMALE
                        - MIXED
                    label:
                      type: string
                      description: >
                        Short string that describes the room for displaying
                        purposes.
                    description:
                      type: string
                      nullable: true
                      description: >
                        Longer description of the room which describes a room
                        to a potential guest.
                    images:
                      type: array
                      description: List of property-level images
                      items:
                        type: object
                        properties:
                          url:
                            type: string
                            description: Publicly accessible URL to the full resolution image
                          description:
                            type: string
                            description: Description of the image to show on a channel (max. 2000 characters)
                          sort_order:
                            type: integer
                            minimum: 0
                            description: >
                              Number indicating the displayed sort order. Lower
                              numbers means further left/top. Defaults to 0.
                        required:
                          - url
                          - description
                          - sort_order
                    rateplans:
                      type: array
                      description: List of rate plans configured for the room
                      items:
                        type: object
                        properties:
                          mya_rate_id:
                            type: integer
                            minimum: 0
                            description: >
                              Rate plan ID on the Cloudbeds channel manager. Every room has a
                              default rate plan, and the ID (even across
                              different rooms) is always `0`. Any non-default
                              rate plans have a higher ID.
                          label_public:
                            type: string
                            nullable: true
                            description: >
                              Name or short summary of the rate plan, suitable
                              for display to guests. The label is chosen by the
                              property.
                          label_private:
                            type: string
                            nullable: true
                            description: >
                              Name or short summary of the rate plan, aimed to
                              be shown just to the property. This could for
                              example be a code like `NF` for "Non-refundable".
                              The label is chosen by the property.
                        required:
                          - mya_rate_id
                          - label_public
                          - label_private
                  required:
                    - mya_room_id
                    - units
                    - beds
                    - dormitory
                    - label
                    - description
                    - images
                verb:
                  type: string
                  enum:
                    - UpdateRoom
              required:
                - room
                - verb
    required: true
  responses:
    "200":
      content:
        application/json:
          examples:
            $ref: ../examples/methods/UpdateRoom.yaml#/rs
          schema:
            oneOf:
              - type: object
                title: Success
                properties:
                  success: { type: boolean, enum: [ true ] }
                  room_mappings:
                    type: array
                    items:
                      type: object
                      properties:
                        mya_rate_id:
                          type: integer
                          minimum: 0
                          description: Rate plan ID on the Cloudbeds channel manager
                        ota_room_id:
                          type: string
                          description: OTA room ID
                        ota_rate_id:
                          type: string
                          description: OTA rate plan ID
                      required:
                        - ota_room_id
                required:
                  - success
              - $ref: ../schemas.d/response_error.yaml
      description: UpdateRoom
  summary: UpdateRoom
