---
post:
  operationId: update_rateplan
  description: >
    Create of update rate plan after it has been changed on the Cloudbeds channel manager.
  requestBody:
    content:
      application/json:
        examples:
          $ref: ../examples/methods/UpdateRatePlan.yaml#/rq
        schema:
          allOf:
            - $ref: ../schemas.yaml#/auth
            - type: object
              properties:
                rateplan:
                  type: object
                  properties:
                    mya_rate_id:
                      type: integer
                      minimum: 1
                      description: Rate plan ID on the Cloudbeds channel manager.
                    ota_rate_id:
                      type: string
                      description: Channel rate plan ID.
                    label_private:
                      type: string
                      description: The private name of the rate plan, only shown to the property.
                    label_public:
                      type: string
                      description: The public name of the rate plan, that can also be shown to customers.
                    max_occupancy:
                      type: integer
                      minimum: 0
                      description: Maximum occupancy, `0` means no restrictions.
                    min_occupancy:
                      type: integer
                      minimum: 0
                      description: Minimum occupancy, `0` means no restrictions.
                    meal_codes:
                      type: array
                      description: >
                        Combination (list) of meal codes that are available for this rate plan.
                        `1` for All-Inclusive, `19` for Breakfast, `21` for Lunch, `22` for Dinner
                      items:
                        type: integer
                        enum:
                          - 1
                          - 19
                          - 21
                          - 22
                  required:
                    - mya_rate_id
                    - label_public
                    - label_private
                verb:
                  type: string
                  enum:
                    - UpdateRatePlan
              required:
                - rateplan
                - verb
    required: true
  responses:
    "200":
      content:
        application/json:
          examples:
            $ref: ../examples/methods/UpdateRatePlan.yaml#/rs
          schema:
            oneOf:
              - type: object
                title: Success
                properties:
                  success: { type: boolean, enum: [ true ] }
                  room_mappings:
                    type: array
                    items:
                      type: object
                      properties:
                        mya_room_id:
                          type: integer
                          minimum: 1
                          description: Room ID on the Cloudbeds channel manager
                        ota_room_id:
                          type: string
                          description: OTA room ID
                        ota_rate_id:
                          type: string
                          description: OTA rate plan ID
                      required:
                        - mya_room_id
                        - ota_room_id
                        - ota_rate_id
                required:
                  - success
              - $ref: ../schemas.d/response_error.yaml
      description: UpdateRatePlan
  summary: UpdateRatePlan
