---
post:
  operationId: update_group_block
  description: |-
    This call is used to update an inventory block for a group on your OTA based on the latest details that we have in Cloudbeds
    (eg. related group block name, status, group block inventory, rates, restrictions, notes, release schedule).
    This call needs to be activated explicitly from our side before you can use it. Please talk to your Cloudbeds contact before
    implementing this call!
  requestBody:
    content:
      application/json:
        examples:
          $ref: ../examples/methods/UpdateGroupBlock.yaml#/rq
        schema:
          allOf:
            - $ref: ../schemas.yaml#/auth
            - type: object
              properties:
                verb:
                  type: string
                  enum:
                    - UpdateGroupBlock
                group_block_data:
                  type: object
                  properties:
                    group_code:
                      type: string
                      description: Group code that was previously passed in CreateGroup call
                    group_data:
                      $ref: ../schemas.d/group.yaml
                    group_block_code:
                      type: string
                    group_block_name:
                      type: string
                    group_block_status:
                      type: string
                      enum:
                        - tentative
                        - lead
                        - definite
                    group_block_notes:
                      type: array
                      items:
                        type: object
                        properties:
                          text:
                            type: string
                          created_at:
                            type: string
                          updated_at:
                            type: string
                    group_block_auto_release:
                      type: object
                      properties:
                        release_type:
                          type: string
                          enum:
                            - all_dates
                            - by_day
                            - by_interval
                        release_days:
                          type: integer
                        release_time:
                          type: string
                          description: HH:MM
                    group_block_ari:
                      type: object
                      description: 'keys of this object - OTA room type IDs'
                      patternProperties:
                        '^.+$':
                          type: object
                          properties:
                            ota_rate_id:
                              type: string
                            data:
                              type: array
                              items:
                                type: object
                                patternProperties:
                                  '^rate_adult_\d+$':
                                    type: number
                                  '^rate_child_\d+$':
                                    type: number
                                properties:
                                  start_date:
                                    type: string
                                    format: date
                                  end_date:
                                    type: string
                                    format: date
                                  units_allotted:
                                    type: integer
                                  units_remaining:
                                    type: integer
                                  units_confirmed:
                                    type: integer
                                  mins:
                                    type: integer
                                  maxs:
                                    type: integer
                                  min_advanced_offset:
                                    type: integer
                                  max_advanced_offset:
                                    type: integer
                                  rate:
                                    type: number
          required:
            - verb
            - group_block_data
    required: true
  responses:
    "200":
      content:
        application/json:
          examples:
            $ref: ../examples/methods/UpdateGroupBlock.yaml#/rs
          schema:
            $ref: ../schemas.d/response_simple.yaml
      description: UpdateGroupBlock
  summary: UpdateGroupBlock
