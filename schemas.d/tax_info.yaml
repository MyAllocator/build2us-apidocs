---
type: object
properties:
  id:
    type: integer
    minimum: 1
    description: Tax/Fee ID in cloudbeds system
  is_fee:
    type: boolean
    description: '"true" if fee. Otherwise tax'
  is_inclusive:
    type: boolean
    default: true
    description: '"true" when tax/fee included in rate.'
  is_per_night:
    type: boolean
    default: true
    description: '"true" when tax/fee is per night, otherwise per stay.'
  is_percent:
    type: boolean
    default: true
    description: '"true" when amount represents percentage, otherwise absolute value.'
  is_refundable:
    type: boolean
    default: true
    description: 'For example, refundable damage deposit fee will set this "true".'
  amount:
    type: number
    description: >
      Tax/fee amount. Either amount in currency or percent, depending on "is_percent" field. For example 20.5 can mean 20.5% or $20.5.
      Only one element either "amount" or "amounts" is supposed to be active, not both.
  amounts:
    type: array
    description: >
      Array of tax/fee amounts. Multiple amounts may apply at the same time depending on the conditions for each item.
      Only one element either "amount" or "amounts" is supposed to be active, not both.
    items:
      type: object
      properties:
        amount:
          description: 'Tax/fee amount. Either amount in currency or percent, depending on is_percent field. For example 20.5 can mean 20.5% or $20.5.'
          type: number
        conditions:
          $ref: './tax_conditions.yaml'
      required:
        - amount
  category:
    type: string
    description: >
      Tax category.
    enum:
      - occupancy_tax
      - other_fee
      - other_tax
      - resort_tax
      - sales_tax
      - service_charge
      - tourism_tax
      - vat
  code:
    type: string
    description: Issued by federal government tax/fee code.
  external_id:
    type: string
    description: >
      Optional custom field to store an external system ID. Not guaranteed to be unique.
  description:
    type: string
    description: Tax/fee description.
  name:
    type: string
    description: Tax/fee name.
  applies_per:
    type: string
    description: >
      To which entity tax/fee is applied.
    enum:
      - adult
      - all-adults
      - booking
      - booking-external-item
      - child
      - children
      - guest
      - pet
      - pets
      - rateplan
      - room
      - room-type
      - service
  conditions:
    $ref: './tax_conditions.yaml'
  tax_basis_includes_fees:
    type: array
    items:
      type: object
      description: Array of fee IDs which will be summed up before calculating this tax. Depends on calculation_basis.
      properties:
        fee_id:
          type: integer
          description: ID of a fee
          minimum: 1
      required:
        - fee_id
  calculation_basis:
    type: string
    description: >
      To what value percentage will be applied in order to calculate tax amount in currency. Only applicable if "is_percent" is "true".
    enum:
      - fees
      - fees-per-night
      - rate
      - rate-and-fees
      - rate-and-fees-per-night
      - rate-per-night
required:
  - applies_per
  - category
  - id
  - is_inclusive
  - is_per_night
  - is_percent
  - is_refundable
  - name

