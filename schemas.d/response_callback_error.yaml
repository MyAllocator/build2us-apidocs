---
type: object
title: Error Response
properties:
  Success:
    type: boolean
    enum: [false]
    description: Always `false` when the response contains an error.
  ErrorCode:
    type: integer
    minimum: 1
    description: >
      Error code. Check the "Error Codes" section of the specification for
      valid codes.
  Error:
    type: string
    description: Human-readable error message.
required:
  - Success
  - ErrorCode
  - Error
