---
type: object
description: >
  Object describing the booking. The fields listed here are
  just the minimum required fields.
properties:
  OrderId:
    type: string
    description: Unique booking ID on the OTA. Maximum of 64 characters.
  OrderAdults:
    type: integer
    minimum: 0
    description: >
      Total number of unique adults. Adult age threshold is defined by
      the channel. Should equal sum of Adults in each room if this
      breakdown is given.
  OrderChildren:
    type: integer
    minimum: 0
    description: >
      Total number of unique children or babies. Child/baby age threshold
      is defined by the channel. Should equal sum of `Children` plus
      `Babies` in each room if this breakdown is given.
  OrderCustomers:
    type: integer
    minimum: 1
    description: >
      Total number of unique customers. Should equal sum of `Occupancy` in
      each room if this breakdown is given. Should also equal the sum of
      `OrderAdults` and `OrderChildren` if those fields are present.
  OrderDate:
    type: string
    format: date
    description: Date of booking creation, in UTC (not date when modified!).
  OrderTime:
    type: string
    pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
    description: >
      Time of booking creation, in UTC. If seconds are not
      provided, set value to ":00". Presence of `OrderTime`
      requires presence of `OrderDate`.
  OrderModifDate:
    type: string
    format: date
    description: >
      Date of booking modification, in UTC. Do not pass if booking has not been modified.
  OrderModifTime:
    type: string
    pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
    description: >
      Time of booking modification, in UTC. Do not pass if booking has not been modified.
      If seconds are not provided, set value to ":00".
  IsCancellation:
    type: integer
    enum:
      - 0
      - 1
    description: "`1` if booking is cancelled."
  IsModification:
    type: integer
    enum:
      - 0
      - 1
    description: "`1` if booking is modified."
  TotalCurrency:
    type: string
    pattern: '^[A-Z]{3}$'
    description: >
      3-letter ISO 4217 currency code for the `TotalPrice`
      field.
  TotalPrice:
    type: number
    description: >
      Total price of the booking, including taxes,
      commission and deposit, after discounts. It should
      reflect the price the guest will have to pay in
      total (or has already paid).
  PaymentCollect:
    type: string
    enum:
      - Property
      - Channel
    description: >
      Who collects outstanding balance from the guest? `Property` means that the property takes
      the payment, either by charging the credit card, or on arrival. `Channel` means that the
      channel will take the payment, and the property is paid by the channel. Do not set this
      to `Channel` if you are only collecting the commission/deposit.
  Customers:
    type: array
    items:
      type: object
      properties:
        CustomerCountry:
          type: string
          pattern: '^[A-Z]{2}$'
          description:
            2-letter ISO 3166-1 alpha-2 country code in which
            the customer resides, corresponding to their
            address. Value is uppercase.
        CustomerEmail:
          type: string
          format: email
          description: Email address of the customer.
        CustomerFName:
          type: string
          description: >
            First name(s) of the customer. If the name is not
            stored separated by first and last name, provide
            full name in `CustomerLName`.
        CustomerLName:
          type: string
          description: Last (family) name or full name of the customer.
      required:
        - CustomerCountry
        - CustomerEmail
        - CustomerFName
        - CustomerLName
  Rooms:
    type: array
    description: List of rooms booked
    items:
      type: object
      properties:
        Adults:
          type: integer
          minimum: 0
          description: >
            Number of adults staying in this room. Adult age
            threshold is defined by the channel.
        Babies:
          type: integer
          minimum: 0
          description: >
            Number of babies staying in this room. Baby age
            threshold is defined by the channel.
        ChannelRoomType:
          type: string
          description:
            The ID of the room on the OTA.
        Children:
          type: integer
          minimum: 0
          description: >
            Number of children staying in this room. Child age
            threshold is defined by the channel.
        Currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: >
            3-letter ISO 4217 currency code for the `Price`
            field.
        DayRates:
          type: array
          description: >
            Contains as many objects as the number of nights
            of the room stay. They need to be sorted by
            date.
          items:
            type: object
            properties:
              Date:
                type: string
                format: date
                description: Date of day rate.
              Description:
                type: string
                description: >
                  Name or short description of the rateplan
                  booked. Example: "Non-refundable rate" or
                  "10% festival discount".
              Rate:
                type: number
                description: >
                  Price for this day, including `Commission`
                  and `Tax`.
              Currency:
                type: string
                pattern: '^[A-Z]{3}$'
                description: >
                  3-letter ISO 4217 currency code for the
                  `Rate` field.
              RateId:
                type: string
                description: Applicable channel rate plan ID for this day rate.
            required:
              - Date
              - Description
              - Rate
              - Currency
              - RateId
        StartDate:
          type: string
          format: date
          description: Arrival date of the customer.
        EndDate:
          type: string
          format: date
          description: >
            The date of the last night of stay (equal to
            departure date minus one).
        Occupancy:
          type: integer
          minimum: 1
          description: >
            Total number of persons staying in this room, including
            children and babies. Should be the sum of `Adults`,
            `Children` and `Babies` if those are present.
        Price:
          type: number
          minimum: 0
          description: >
            Total price of the room, for all units and all
            days, including taxes and fees. Example: stay
            is for two days and three units and a single
            night costs €10 (including tax), then `Price`
            is 2 * 3 * 10 = 60.
        Units:
          type: integer
          minimum: 1
          description: >
            Number of rooms booked (for private rooms) or
            number of beds booked (for dorms/shared
            rooms).
        RateDesc:
          type: string
          description: Description of the booked rate plan, as provided by the channel.
        RateId:
          type: string
          description: >
            Applicable rate plan ID for this booking. Normally there is only
            one. If there are multiple, list them comma-separated.
      required:
        - Adults
        - Babies
        - ChannelRoomType
        - Children
        - Currency
        - DayRates
        - EndDate
        - Occupancy
        - Price
        - RateDesc
        - RateId
        - StartDate
        - Units
required:
  - Customers
  - IsCancellation
  - IsModification
  - OrderAdults
  - OrderChildren
  - OrderCustomers
  - OrderDate
  - OrderId
  - OrderTime
  - PaymentCollect
  - Rooms
  - TotalCurrency
  - TotalPrice