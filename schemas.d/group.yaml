---
type: object
properties:
  group_code:
    type: string
  group_name:
    type: string
  group_status:
    type: string
    enum:
      - open
      - close
  group_notes:
    type: array
    items:
      type: object
      properties:
        text:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
  address:
    type: object
    properties:
      city:
        type: string
      zip:
        type: string
      state:
        type: string
      address_line1:
        type: string
      address_line2:
        type: string
  contacts:
    type: array
    items:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        emails:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - personal
                  - business
              value:
                type: string
        phones:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - home
                  - work
                  - mobile
                  - fax
              value:
                type: string
        role:
          type: string
